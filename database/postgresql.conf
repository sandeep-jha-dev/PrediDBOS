# PrediDBOS PostgreSQL Configuration
# Place this in /etc/postgresql/postgresql.conf or mount as config file

# Enable pg_stat_statements for workload collection
shared_preload_libraries = 'pg_stat_statements'

# Listen on all interfaces
listen_addresses = '*'

# Track all queries (not just top-level)
pg_stat_statements.track = all

# Track planning time
pg_stat_statements.track_planning = on

# Track utility commands
pg_stat_statements.track_utility = on

# Save stats on shutdown
pg_stat_statements.save = on

# Max statements to track
pg_stat_statements.max = 10000

# Logging
log_min_duration_statement = 100
log_statement = 'none'
log_duration = off

# Memory
shared_buffers = 256MB
effective_cache_size = 1GB
work_mem = 16MB
maintenance_work_mem = 128MB

# Checkpoint
checkpoint_completion_target = 0.9
wal_buffers = 16MB
default_statistics_target = 100

# Connections
max_connections = 100